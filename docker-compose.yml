services:
  calculator:
    build: .
    image: calculator:latest
    # Two replicas behind the proxy (no host port published; only nginx is exposed)
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "prod"
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxRAMPercentage=75.0"
    expose:
      - "8080"
    networks:
      - calculator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-1111}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calculator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  calculator-net:
    driver: bridge
